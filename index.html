// ─── DELAYS PAGE ──────────────────────────────────────────────────────────────

// Maps dataset reason strings → 7 canonical categories
const REASON_MAP = {
  'Weather':            'Weather',
  'Air traffic control':'Air Traffic',
  'Late aircraft':      'Late Aircraft',
  'Mechanical issue':   'Technical Issue',
  'Crew availability':  'Crew',
  'Fueling delay':      'Technical Issue',
  'Security screening': 'Security',
  'Boarding delay':     'Other',
  'Connecting flight':  'Other',
  'Catering delay':     'Other',
};
const REASON_COLORS = {
  'Weather':       '#3b82f6',
  'Air Traffic':   '#8b5cf6',
  'Late Aircraft': '#f59e0b',
  'Technical Issue':'#ef4444',
  'Crew':          '#10b981',
  'Security':      '#0891b2',
  'Other':         '#94a3b8',
};
function canonReason(r) { return REASON_MAP[r] || 'Other'; }

function DelaysPage({ data: allData }) {
  const [airlineF, setAirlineF] = useState('All');
  const [reasonF,  setReasonF]  = useState('All');
  const [search,   setSearch]   = useState('');
  const [page,     setPage]     = useState(1);

  const airlineOpts = useMemo(() =>
    ['All', ...Array.from(new Set(allData.map(f => f.airline))).sort()], [allData]);
  const reasonOpts = ['All', 'Weather', 'Air Traffic', 'Late Aircraft', 'Technical Issue', 'Crew', 'Security', 'Other'];

  // Apply filters
  const data = useMemo(() => allData.filter(f => {
    if (airlineF !== 'All' && f.airline !== airlineF) return false;
    if (reasonF  !== 'All' && f.delay_reason && canonReason(f.delay_reason) !== reasonF) return false;
    if (reasonF  !== 'All' && !f.delay_reason) return false;
    return true;
  }), [allData, airlineF, reasonF]);

  // ── Aggregations ────────────────────────────────────────────
  const stats = useMemo(() => {
    const delayed    = data.filter(f => f.flight_status === 'Delayed');
    const cancelled  = data.filter(f => f.flight_status === 'Cancelled');
    const totalDelay = delayed.reduce((s, f) => s + f.delay_minutes, 0);
    const avgDelay   = delayed.length ? (totalDelay / delayed.length).toFixed(1) : '0.0';
    const maxDelay   = delayed.length ? Math.max(...delayed.map(f => f.delay_minutes)) : 0;
    const delayRate  = parseFloat(pct(delayed.length,   data.length));
    const cancelRate = parseFloat(pct(cancelled.length, data.length));

    // Canonical reasons
    const byReason = {};
    data.filter(f => f.delay_reason).forEach(f => {
      const cat = canonReason(f.delay_reason);
      if (!byReason[cat]) byReason[cat] = { count: 0, totalMin: 0 };
      byReason[cat].count++;
      byReason[cat].totalMin += f.delay_minutes;
    });
    const reasonRows = Object.entries(byReason)
      .sort((a, b) => b[1].count - a[1].count)
      .map(([label, v]) => ({
        label, value: v.count,
        avgMin: (v.totalMin / v.count).toFixed(0),
        color: REASON_COLORS[label] || '#94a3b8',
      }));

    // By airline
    const byAirline = {};
    data.forEach(f => {
      if (!byAirline[f.airline]) byAirline[f.airline] = { delayed: 0, cancelled: 0, total: 0, totalDelay: 0 };
      byAirline[f.airline].total++;
      if (f.flight_status === 'Delayed')   { byAirline[f.airline].delayed++; byAirline[f.airline].totalDelay += f.delay_minutes; }
      if (f.flight_status === 'Cancelled') byAirline[f.airline].cancelled++;
    });
    const airlineRows = Object.entries(byAirline)
      .sort((a, b) => b[1].delayed - a[1].delayed)
      .map(([label, v]) => ({
        label,
        total:      v.total,
        delayed:    v.delayed,
        cancelled:  v.cancelled,
        totalDelay: v.totalDelay,
        delayRate:  pct(v.delayed,    v.total),
        cancelRate: pct(v.cancelled,  v.total),
        avgDelay:   v.delayed ? (v.totalDelay / v.delayed).toFixed(1) : '0.0',
      }));

    // By airport
    const byAirport = {};
    data.filter(f => f.flight_status === 'Delayed').forEach(f => {
      if (!byAirport[f.origin_airport]) byAirport[f.origin_airport] = { delayed: 0, totalDelay: 0 };
      byAirport[f.origin_airport].delayed++;
      byAirport[f.origin_airport].totalDelay += f.delay_minutes;
    });
    const airportRows = Object.entries(byAirport)
      .sort((a, b) => b[1].delayed - a[1].delayed).slice(0, 15)
      .map(([label, v]) => ({
        label,
        value: v.delayed,
        avgDelay: Math.round(v.totalDelay / v.delayed),
        color: '#f59e0b',
      }));
    const airportAvgRows = [...airportRows]
      .sort((a, b) => b.avgDelay - a.avgDelay)
      .map(r => ({ label: r.label, value: r.avgDelay, color: '#ef4444' }));

    // By route
    const byRoute = {};
    data.filter(f => f.flight_status === 'Delayed').forEach(f => {
      if (!byRoute[f.route]) byRoute[f.route] = { delayed: 0, totalDelay: 0 };
      byRoute[f.route].delayed++;
      byRoute[f.route].totalDelay += f.delay_minutes;
    });
    const routeRows = Object.entries(byRoute)
      .sort((a, b) => b[1].delayed - a[1].delayed).slice(0, 10)
      .map(([label, v]) => ({
        label,
        value: v.delayed,
        avgDelay: Math.round(v.totalDelay / v.delayed),
        color: '#8b5cf6',
      }));

    // Delay trend by date
    const byDate = {};
    data.filter(f => f.flight_status === 'Delayed').forEach(f => {
      if (!byDate[f.departure_date]) byDate[f.departure_date] = 0;
      byDate[f.departure_date]++;
    });
    const trendPoints = Object.entries(byDate)
      .sort((a, b) => a[0] > b[0] ? 1 : -1)
      .map(([x, y]) => ({ x, y }));

    // Duration buckets
    const buckets = [
      { label: '< 30m',    min: 0,   max: 30,  count: 0, color: '#10b981' },
      { label: '30–60m',   min: 30,  max: 60,  count: 0, color: '#3b82f6' },
      { label: '60–120m',  min: 60,  max: 120, count: 0, color: '#f59e0b' },
      { label: '120–180m', min: 120, max: 180, count: 0, color: '#ef4444' },
      { label: '> 180m',   min: 180, max: Infinity, count: 0, color: '#7c2d12' },
    ];
    delayed.forEach(f => {
      const b = buckets.find(b => f.delay_minutes >= b.min && f.delay_minutes < b.max);
      if (b) b.count++;
    });
    const bucketRows = buckets.map(b => ({ label: b.label, value: b.count, color: b.color }));

    return {
      delayed, cancelled, totalDelay, avgDelay, maxDelay,
      delayRate, cancelRate,
      reasonRows, airlineRows, airportRows, airportAvgRows,
      routeRows, trendPoints, bucketRows,
    };
  }, [data]);

  // Searchable delayed-flights table
  const tableFlights = useMemo(() => {
    const base = allData.filter(f => f.flight_status === 'Delayed' &&
      (airlineF === 'All' || f.airline === airlineF) &&
      (reasonF  === 'All' || (f.delay_reason && canonReason(f.delay_reason) === reasonF)));
    if (!search) return base;
    const q = search.toLowerCase();
    return base.filter(f =>
      f.flight_number.toLowerCase().includes(q) ||
      f.route.toLowerCase().includes(q) ||
      f.airline.toLowerCase().includes(q) ||
      f.origin_airport.toLowerCase().includes(q) ||
      (f.delay_reason || '').toLowerCase().includes(q)
    );
  }, [allData, airlineF, reasonF, search]);

  const totalPages = Math.max(1, Math.ceil(tableFlights.length / PAGE_SIZE));
  const safePage   = Math.min(page, totalPages);
  const pagedFlights = tableFlights.slice((safePage - 1) * PAGE_SIZE, safePage * PAGE_SIZE);

  return (
    <div>
      {/* Filters */}
      <div className="filters" style={{ marginBottom: 16 }}>
        <span className="filter-label">Airline</span>
        <select className="filter-input" value={airlineF} onChange={e => { setAirlineF(e.target.value); setPage(1); }}>
          {airlineOpts.map(a => <option key={a}>{a}</option>)}
        </select>
        <span className="filter-label">Reason</span>
        <select className="filter-input" value={reasonF} onChange={e => { setReasonF(e.target.value); setPage(1); }}>
          {reasonOpts.map(r => <option key={r}>{r}</option>)}
        </select>
        <button className="page-btn" style={{ marginLeft: 4 }} onClick={() => { setAirlineF('All'); setReasonF('All'); setPage(1); }}>Reset</button>
        <span className="gf-count" style={{ marginLeft: 'auto' }}>{data.length} / {allData.length} flights</span>
      </div>

      {/* KPI cards */}
      <div className="stat-grid" style={{ gridTemplateColumns: 'repeat(5,1fr)', marginBottom: 20 }}>
        <div className="stat-card yellow">
          <div className="label">Total Delayed</div>
          <div className="value">{fmt(stats.delayed.length)}</div>
          <div className="sub">{pct(stats.delayed.length, data.length)}% of filtered flights</div>
        </div>
        <div className="stat-card yellow">
          <div className="label">Average Delay</div>
          <div className="value">{stats.avgDelay}<span style={{ fontSize: 15 }}>m</span></div>
          <div className="sub">Delayed flights only</div>
        </div>
        <div className="stat-card red">
          <div className="label">Maximum Delay</div>
          <div className="value">{fmt(stats.maxDelay)}<span style={{ fontSize: 15 }}>m</span></div>
          <div className="sub">{(stats.maxDelay / 60).toFixed(1)}h worst case</div>
        </div>
        <div className="stat-card red">
          <div className="label">Delay Rate</div>
          <div className="value">{stats.delayRate}%</div>
          <div className="sub">Of all filtered flights</div>
        </div>
        <div className="stat-card red">
          <div className="label">Cancellation Rate</div>
          <div className="value">{stats.cancelRate}%</div>
          <div className="sub">{fmt(stats.cancelled.length)} cancelled flights</div>
        </div>
      </div>

      {/* Row 1: Delay Trend + Delay Reasons donut-style */}
      <div className="chart-grid-top" style={{ marginBottom: 16 }}>
        <div className="chart-card">
          <div className="chart-header">
            <div><div className="chart-title">Delay Trend Over Time</div>
            <div className="chart-subtitle">Daily count of delayed departures</div></div>
          </div>
          <LineChart points={stats.trendPoints} color="#f59e0b" />
        </div>
        <div className="chart-card">
          <div className="chart-header">
            <div><div className="chart-title">Delay Reasons</div>
            <div className="chart-subtitle">By canonical category</div></div>
          </div>
          {stats.reasonRows.length === 0
            ? <div className="empty-state" style={{ padding: '30px 0' }}><div className="es-icon">✅</div><div className="es-title">No delays</div></div>
            : <BigDonut segments={stats.reasonRows.map(r => ({ label: r.label, value: r.value, color: r.color }))} />
          }
        </div>
      </div>

      {/* Row 2: Delays by Airline + Avg Delay by Airline */}
      <div className="chart-grid-mid" style={{ marginBottom: 16 }}>
        <div className="chart-card">
          <div className="chart-header">
            <div><div className="chart-title">Delays by Airline</div>
            <div className="chart-subtitle">Total delayed flights per carrier</div></div>
          </div>
          <HBarChart
            rows={stats.airlineRows.map(r => ({ label: r.label, value: r.delayed, color: '#f59e0b' }))}
            color="#f59e0b" />
        </div>
        <div className="chart-card">
          <div className="chart-header">
            <div><div className="chart-title">Average Delay by Airline</div>
            <div className="chart-subtitle">Minutes — delayed flights only</div></div>
          </div>
          <HBarChart
            rows={stats.airlineRows.filter(r => r.delayed > 0)
              .map(r => ({ label: r.label, value: parseFloat(r.avgDelay), color: '#ef4444' }))}
            color="#ef4444" unit=" min" />
        </div>
      </div>

      {/* Row 3: Delays by Airport + Delays by Route */}
      <div className="chart-grid-mid" style={{ marginBottom: 16 }}>
        <div className="chart-card">
          <div className="chart-header">
            <div><div className="chart-title">Delays by Airport</div>
            <div className="chart-subtitle">Delayed departures per origin airport</div></div>
          </div>
          <HBarChart rows={stats.airportRows} color="#f59e0b" />
        </div>
        <div className="chart-card">
          <div className="chart-header">
            <div><div className="chart-title">Delays by Route</div>
            <div className="chart-subtitle">Top 10 routes by delayed flights</div></div>
          </div>
          <HBarChart rows={stats.routeRows} color="#8b5cf6" />
        </div>
      </div>

      {/* Row 4: Duration buckets + Delay Reason breakdown table */}
      <div className="chart-grid-mid" style={{ marginBottom: 16 }}>
        <div className="chart-card">
          <div className="chart-header">
            <div><div className="chart-title">Delay Duration Buckets</div>
            <div className="chart-subtitle">Distribution of delay severity</div></div>
          </div>
          <HBarChart rows={stats.bucketRows} color="#f59e0b" />
        </div>
        <div className="chart-card">
          <div className="chart-header">
            <div><div className="chart-title">Delay Reason Detail</div>
            <div className="chart-subtitle">Count + average delay per category</div></div>
          </div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Flights</th>
                  <th>% of Delays</th>
                  <th>Avg Min</th>
                  <th>Share</th>
                </tr>
              </thead>
              <tbody>
                {stats.reasonRows.length === 0
                  ? <tr><td colSpan={5} style={{ textAlign: 'center', color: '#94a3b8', padding: 24 }}>No delay data</td></tr>
                  : stats.reasonRows.map((r, i) => (
                    <tr key={i}>
                      <td>
                        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                          <span style={{ width: 10, height: 10, borderRadius: 2, background: r.color, display: 'inline-block' }} />
                          <strong>{r.label}</strong>
                        </span>
                      </td>
                      <td style={{ fontWeight: 700, color: r.color }}>{r.value}</td>
                      <td>{pct(r.value, stats.delayed.length)}%</td>
                      <td><span style={{ color: '#d97706', fontWeight: 600 }}>{r.avgMin}m</span></td>
                      <td style={{ minWidth: 80 }}>
                        <div style={{ height: 5, background: '#f1f5f9', borderRadius: 3, overflow: 'hidden' }}>
                          <div style={{ height: '100%', width: pct(r.value, stats.delayed.length)+'%', background: r.color, borderRadius: 3 }} />
                        </div>
                      </td>
                    </tr>
                  ))
                }
              </tbody>
            </table>
          </div>
        </div>
      </div>

      {/* Airline summary table */}
      <div className="card" style={{ padding: 0, overflow: 'hidden', marginBottom: 16 }}>
        <div style={{ padding: '14px 16px 10px', borderBottom: '1px solid #f1f5f9' }}>
          <span style={{ fontWeight: 700, fontSize: 13 }}>Delay &amp; Cancellation by Airline</span>
        </div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Airline</th>
                <th>Total</th>
                <th>Delayed</th>
                <th>Delay Rate</th>
                <th>Avg Delay</th>
                <th>Total Delay (min)</th>
                <th>Cancelled</th>
                <th>Cancel Rate</th>
              </tr>
            </thead>
            <tbody>
              {stats.airlineRows.map((r, i) => (
                <tr key={i}>
                  <td><strong>{r.label}</strong></td>
                  <td>{r.total}</td>
                  <td><span style={{ color: '#d97706', fontWeight: 700 }}>{r.delayed}</span></td>
                  <td>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                      <div style={{ flex: 1, height: 5, background: '#f1f5f9', borderRadius: 3, overflow: 'hidden', minWidth: 36 }}>
                        <div style={{ height: '100%', width: r.delayRate+'%', background: '#f59e0b', borderRadius: 3 }} />
                      </div>
                      <span style={{ fontSize: 12, fontWeight: 700, color: '#d97706', width: 36 }}>{r.delayRate}%</span>
                    </div>
                  </td>
                  <td><span style={{ fontWeight: 700, color: '#d97706' }}>{r.avgDelay}m</span></td>
                  <td style={{ color: '#718096', fontSize: 12 }}>{fmt(r.totalDelay)}</td>
                  <td><span style={{ color: '#ef4444', fontWeight: 700 }}>{r.cancelled}</span></td>
                  <td><span style={{ color: '#ef4444', fontSize: 12 }}>{r.cancelRate}%</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Searchable delayed flights table */}
      <div className="card" style={{ padding: 0, overflow: 'hidden', marginBottom: 8 }}>
        <div style={{ padding: '14px 16px 10px', borderBottom: '1px solid #f1f5f9', display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontWeight: 700, fontSize: 13 }}>Delayed Flights</span>
          <span className="badge badge-yellow" style={{ fontSize: 11 }}>{tableFlights.length} flights</span>
          <input className="filter-input" placeholder="🔍 Flight #, route, airline, reason…"
            value={search} onChange={e => { setSearch(e.target.value); setPage(1); }}
            style={{ marginLeft: 'auto', minWidth: 240, padding: '4px 10px', fontSize: 12 }} />
        </div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Flight #</th>
                <th>Airline</th>
                <th>Route</th>
                <th>Date</th>
                <th>Sched Dep</th>
                <th>Actual Dep</th>
                <th>Delay</th>
                <th>Category</th>
                <th>Raw Reason</th>
              </tr>
            </thead>
            <tbody>
              {pagedFlights.length === 0 ? (
                <tr><td colSpan={9}>
                  <div className="empty-state"><div className="es-icon">⏱️</div><div className="es-title">No delayed flights match</div><div className="es-sub">Try adjusting your filters</div></div>
                </td></tr>
              ) : pagedFlights.map((f, i) => {
                const cat = canonReason(f.delay_reason || '');
                return (
                  <tr key={i}>
                    <td><strong style={{ color: '#f59e0b' }}>{f.flight_number}</strong></td>
                    <td style={{ fontSize: 12, whiteSpace: 'nowrap' }}>{f.airline}</td>
                    <td style={{ fontSize: 12, whiteSpace: 'nowrap' }}>{f.route}</td>
                    <td style={{ fontSize: 12 }}>{f.departure_date}</td>
                    <td style={{ fontSize: 12 }}>{f.scheduled_departure}</td>
                    <td style={{ fontSize: 12 }}>{f.actual_departure || '—'}</td>
                    <td><span style={{ fontWeight: 700, color: '#d97706' }}>{f.delay_minutes}m</span></td>
                    <td>
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11, fontWeight: 600, color: REASON_COLORS[cat] || '#94a3b8' }}>
                        <span style={{ width: 8, height: 8, borderRadius: '50%', background: REASON_COLORS[cat] || '#94a3b8', display: 'inline-block' }} />
                        {cat}
                      </span>
                    </td>
                    <td style={{ fontSize: 11, color: '#94a3b8' }}>{f.delay_reason}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      <Pagination page={safePage} totalPages={totalPages} setPage={setPage} />
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("overview");

  const data         = window.FLIGHTS_DATA  || [];
  const airportsMeta = window.AIRPORTS_META || [];

  const pageEl = useMemo(() => {
    switch (page) {
      case "overview":   return <OverviewPage   data={data} />;
      case "flights":    return <FlightsPage    data={data} />;
      case "routes":     return <RoutesPage     data={data} />;
      case "airports":   return <AirportsPage   data={data} airportsMeta={airportsMeta} />;
      case "passengers": return <PassengersPage data={data} />;
      case "delays":     return <DelaysPage     data={data} />;
      default:           return <OverviewPage   data={data} />;
    }
  }, [page, data, airportsMeta]);

  return (
    <div className="layout">
      <Sidebar active={page} onNav={setPage} />
      <div className="main">
        <TopBar page={page} total={data.length} />
        <div className="page-content">
          {pageEl}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
